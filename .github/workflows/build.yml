name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ambil zygisk.hpp
        run: curl -fsSL -o zygisk.hpp https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp
      - name: Build
        run: |
          $ANDROID_NDK_LATEST_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk
          mkdir -p pkg/zygisk
          cp libs/arm64-v8a/libczn_speed.so pkg/zygisk/arm64-v8a.so
          cp module.prop customize.sh pkg/
          cd pkg && zip -r ../czn_speed.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: czn_speed
          path: czn_speed.zip
          
